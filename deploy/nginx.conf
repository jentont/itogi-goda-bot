server {
    server_name itogi.example.com;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Стикеры и карточки отдаём с кэшем
    location ~ ^/(app|cards)/ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
    }
    listen 80;
    # Дальше: sudo certbot --nginx -d itogi.example.com
}
